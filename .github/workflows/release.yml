name: Release

# Manually-triggered release pipeline.
#
# Releases used to fire on every push to `main`, which produced a new
# GitHub Release per commit. They are now manual: batch up commits on `main`
# and trigger this workflow when you want to cut a release. The recommended
# way to do so is via the `bin/release` script (or `yarn release`), which
# previews the next version locally and then dispatches this workflow.
#
# Job 1 (build-macos): runs semantic-release --dry-run to find out if the
#   selected ref warrants a new version. If yes, patches package.json with the
#   next version, builds the macOS DMG + ZIP, and uploads them as workflow
#   artifacts.
#
# Job 2 (release): runs the real semantic-release, downloads the DMG + ZIP
#   artifacts, and attaches them to the GitHub Release.
#
# Built-in GitHub token is used for checkout and read-only repository access.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional note for this manual release (shown in the run summary).'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Comma-separated GitHub usernames that are allowed to trigger this workflow.
# This is a fast-fail "first line" check — the real, GitHub-enforced gate is
# the `environment: production` on each job, which requires an approver
# configured in repo Settings → Environments → production.
env:
  RELEASE_ALLOWED_ACTORS: 'usrivastava92'

jobs:
  # ── Job 0: actor allow-list preflight ────────────────────────────────────
  # Cheap, immediate check so an unauthorized dispatch fails in seconds
  # instead of sitting in the environment approvals queue.
  authorize:
    name: Authorize actor
    runs-on: ubuntu-latest
    steps:
      - name: Check triggering actor against allow-list
        env:
          ACTOR: ${{ github.triggering_actor }}
          ALLOWED: ${{ env.RELEASE_ALLOWED_ACTORS }}
        run: |
          echo "Triggered by: $ACTOR"
          echo "Allow-list:   $ALLOWED"
          # Comma- or whitespace-separated list match.
          if printf '%s' ",$ALLOWED," | tr -d ' ' | grep -q ",${ACTOR},"; then
            echo "✓ $ACTOR is authorized to trigger releases."
          else
            echo "✗ $ACTOR is NOT in RELEASE_ALLOWED_ACTORS." >&2
            echo "  Update the allow-list in .github/workflows/release.yml" >&2
            echo "  if this user should be able to cut releases." >&2
            exit 1
          fi

  # ── Job 1: build macOS artifacts ──────────────────────────────────────────
  build-macos:
    name: Build macOS artifacts
    runs-on: macos-latest
    needs: authorize
    # GitHub-enforced gate: this job will not start until a reviewer configured
    # on the `production` environment (Settings → Environments → production)
    # clicks "Approve and run". Environment secrets (e.g. APP_PRIVATE_KEY and
    # other App credentials) should live on this environment so they cannot
    # leak to unapproved runs.
    environment: production
    outputs:
      next-version: ${{ steps.dry-run.outputs.version }}
      will-release: ${{ steps.dry-run.outputs.will_release }}
    steps:
      - name: Record trigger reason
        if: ${{ inputs.reason != '' }}
        run: echo "Manual release reason — ${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: corepack enable

      - run: yarn install --immutable

      - name: Determine next version (dry-run)
        id: dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --quiet

          RELEASE_INFO=$(node scripts/resolve-release-version.mjs)
          echo "$RELEASE_INFO"

          VERSION=$(printf '%s\n' "$RELEASE_INFO" | node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(0, 'utf8')); process.stdout.write(data.version);")
          WILL_RELEASE=$(printf '%s\n' "$RELEASE_INFO" | node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(0, 'utf8')); process.stdout.write(String(data.willRelease));")

          if [ "$WILL_RELEASE" = 'true' ]; then
            echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
            echo "will_release=true"  >> "$GITHUB_OUTPUT"
          else
            echo "will_release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits — skipping macOS artifact build"
          fi

      - name: Patch package.json to next version
        if: steps.dry-run.outputs.will_release == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.dry-run.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Typecheck
        if: steps.dry-run.outputs.will_release == 'true'
        run: yarn typecheck

      - name: Build
        if: steps.dry-run.outputs.will_release == 'true'
        run: yarn build

      - name: Package macOS DMG + ZIP
        if: steps.dry-run.outputs.will_release == 'true'
        run: npx electron-builder --mac dmg zip --publish never

      - name: Normalize release artifact names
        if: steps.dry-run.outputs.will_release == 'true'
        run: node scripts/normalize-release-artifact-names.mjs release

      - name: Upload DMG artifact
        if: steps.dry-run.outputs.will_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 1

      - name: Upload ZIP artifact
        if: steps.dry-run.outputs.will_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos-zip
          path: release/*.zip
          if-no-files-found: error
          retention-days: 1

  # ── Job 2: semantic-release ───────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-macos
    if: needs.build-macos.outputs.will-release == 'true'
    # Same hard gate as build-macos. In practice this job inherits the
    # approval that was granted to build-macos within the same run, so you
    # only have to approve once per release.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: corepack enable

      - run: yarn install --immutable

      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: dmg-artifacts

      - uses: actions/download-artifact@v8
        with:
          name: macos-zip
          path: zip-artifacts

      - name: Mint source App token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: usrivastava92
          repositories: gtv-desktop-remote
          permission-contents: write

      - name: Verify semantic-release version policy
        env:
          GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
          EXPECTED_VERSION: ${{ needs.build-macos.outputs.next-version }}
        run: |
          git fetch --tags --quiet

          RELEASE_INFO=$(node scripts/resolve-release-version.mjs)
          echo "$RELEASE_INFO"

          COMPUTED_VERSION=$(printf '%s\n' "$RELEASE_INFO" | node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(0, 'utf8')); process.stdout.write(data.version);")
          if [ "$COMPUTED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Computed version $COMPUTED_VERSION does not match build output $EXPECTED_VERSION" >&2
            exit 1
          fi

          OUTPUT=$(yarn semantic-release --dry-run --no-ci 2>&1)
          echo "$OUTPUT"
          SEMANTIC_VERSION=$(printf '%s\n' "$OUTPUT" | sed -nE 's/.*next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)

          if [ "$SEMANTIC_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "semantic-release wanted $SEMANTIC_VERSION but expected $EXPECTED_VERSION" >&2
            exit 1
          fi

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
        run: yarn semantic-release

      - name: Mint Homebrew tap App token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: usrivastava92
          repositories: homebrew-tap
          permission-contents: write

      - name: Checkout Homebrew tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: usrivastava92/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          persist-credentials: true

      - name: Update Homebrew tap
        env:
          GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
          RELEASE_VERSION: ${{ needs.build-macos.outputs.next-version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          DMG_PATH=$(find dmg-artifacts -type f -name '*.dmg' | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG artifact found."
            exit 1
          fi

          DMG_SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          RELEASE_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${SOURCE_REPOSITORY}/releases/tags/v${RELEASE_VERSION}")
          RELEASE_DMG_NAME=$(printf '%s\n' "$RELEASE_JSON" | node -e "const fs = require('fs'); const release = JSON.parse(fs.readFileSync(0, 'utf8')); const digest = 'sha256:' + process.argv[1]; const asset = release.assets.find((candidate) => candidate.name.endsWith('.dmg') && candidate.digest === digest) ?? release.assets.find((candidate) => candidate.name.endsWith('.dmg') && candidate.name.includes('-mac-')); if (!asset) { process.exit(1); } process.stdout.write(asset.name);" "$DMG_SHA256")

          if [ -z "$RELEASE_DMG_NAME" ]; then
            echo "Could not determine uploaded DMG asset name from GitHub release." >&2
            exit 1
          fi

          node scripts/render-homebrew-cask.mjs \
            --version "$RELEASE_VERSION" \
            --sha256 "$DMG_SHA256" \
            --artifact-name "$RELEASE_DMG_NAME" \
            --repository "$SOURCE_REPOSITORY" \
            > homebrew-tap/Casks/gtv-desktop-remote.rb

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gtv-desktop-remote.rb

          if git diff --cached --quiet; then
            echo "Homebrew cask is already up to date."
            exit 0
          fi

          git commit -m "Update gtv-desktop-remote to ${RELEASE_VERSION}"
          git push origin HEAD:main
