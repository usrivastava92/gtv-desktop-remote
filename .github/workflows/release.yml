name: Release

# Triggered on every push to main and via workflow_dispatch.
#
# Job 1 (build-macos): runs semantic-release --dry-run to find out if this
#   push warrants a new version. If yes, patches package.json with the next
#   version, builds the macOS DMG, and uploads it as a workflow artifact.
#
# Job 2 (release): runs the real semantic-release, downloads the DMG artifact,
#   and attaches it to the GitHub Release.
#
# GITHUB_TOKEN is provided automatically by GitHub Actions — no secret needed.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Job 1: build macOS DMG ────────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    outputs:
      next-version: ${{ steps.dry-run.outputs.version }}
      will-release: ${{ steps.dry-run.outputs.will_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Determine next version (dry-run)
        id: dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all tags so semantic-release can find the last release tag.
          # actions/checkout with fetch-depth:0 fetches commits but tags may
          # still be missing on some runners.
          git fetch --tags --quiet

          OUTPUT=$(npx semantic-release --dry-run --no-ci 2>&1)
          echo "$OUTPUT"
          # Match both message variants:
          #   "The next release version is X.Y.Z"
          #   "There is no previous release, the next release version is X.Y.Z"
          VERSION=$(printf '%s\n' "$OUTPUT" | sed -nE 's/.*next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)
          if [ -n "$VERSION" ]; then
            echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
            echo "will_release=true"  >> "$GITHUB_OUTPUT"
          else
            echo "will_release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits — skipping DMG build"
          fi

      - name: Patch package.json to next version
        if: steps.dry-run.outputs.will_release == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.dry-run.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Typecheck
        if: steps.dry-run.outputs.will_release == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.dry-run.outputs.will_release == 'true'
        run: npm run build

      - name: Package macOS DMG
        if: steps.dry-run.outputs.will_release == 'true'
        run: npx electron-builder --mac dmg --publish never

      - name: Upload DMG artifact
        if: steps.dry-run.outputs.will_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 1

  # ── Job 2: semantic-release ───────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-macos
    if: needs.build-macos.outputs.will-release == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: dmg-artifacts

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY || 'usrivastava92/homebrew-tap' }}
          RELEASE_VERSION: ${{ needs.build-macos.outputs.next-version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap update."
            exit 0
          fi

          DMG_PATH=$(find dmg-artifacts -type f -name '*.dmg' | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG artifact found."
            exit 1
          fi

          DMG_NAME=$(basename "$DMG_PATH")
          DMG_SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" homebrew-tap
          mkdir -p homebrew-tap/Casks

          node scripts/render-homebrew-cask.mjs \
            --version "$RELEASE_VERSION" \
            --sha256 "$DMG_SHA256" \
            --artifact-name "$DMG_NAME" \
            --repository "$SOURCE_REPOSITORY" \
            > homebrew-tap/Casks/gtv-desktop-remote.rb

          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gtv-desktop-remote.rb

          if git diff --cached --quiet; then
            echo "Homebrew cask is already up to date."
            exit 0
          fi

          git commit -m "Update gtv-desktop-remote to ${RELEASE_VERSION}"
          git push origin HEAD
