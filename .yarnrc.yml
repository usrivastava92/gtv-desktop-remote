enableGlobalCache: true

nodeLinker: node-modules

npmRegistryServer: 'https://registry.npmjs.org'

# Explicitly approved owned release; keep the age gate for all other packages.
npmPreapprovedPackages:
  - '@librecontrol/google-tv@1.0.2'
  - '@librecontrol/apple-tv@1.0.0'
  - '@librecontrol/fire-tv@1.1.0'

packageExtensions:
  '@librecontrol/apple-tv@1.0.0':
    dependencies:
      '@noble/ciphers': '2.4.0'

yarnPath: .yarn/releases/yarn-4.18.1.cjs
